{% extends 'sending/base.html' %}
{% block content %}
<div class="col-lg-3 col-md-6 col-sm-12 ">
    <div class="card mb-4 box-shadow">
        <div class="col-lg-6 col-md-8 mx-auto">
            <div class="card-body">
                <form method="post" action="" class="form-floating">
                    {% csrf_token %}
                    <p>Хотите удалить "{{ object.title }}"?</p>
                    <button type="submit" class="btn btn-lg btn-block btn-outline-danger">Подтвердить</button>
                    <a href="{% url 'sending:blasts' %}" class="btn btn-sm btn-outline-warning">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
