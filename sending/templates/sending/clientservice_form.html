{% extends 'sending/base.html' %}
{% block content %}
<section class="py-5 text-center container">
<div class="col-12">
    <form method="post" enctype="multipart/form-data" action="" class="form-floating">
        <div class="col-6 ">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h3 class="my-0 font-weight-normal">{{ title }}</h3>
                </div>
                <div class="card-body">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-lg btn-block btn-outline-success">{{ button_name }}</button>
                </div>
                <div class="card-footer">
                </div>
            </div>
        </div>
    </form>
</div>
    </section>
{% endblock %}
