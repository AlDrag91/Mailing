{% extends 'sending/base.html' %}
{% load my_tags %}
{% block content %}
<section class="py-5 text-center container">
    <div class="card-header">
        <h4 class="my-0 font-weight-normal">Пользователь: {{ title }}</h4>
    </div>
    <div class="card-body">
        <form method="post" action="" class="form-floating" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-lg btn-block btn-outline-success">Сохранить</button>
            <div class='col-6'>
                <svg class="bd-placeholder-img card-img-top" width="100%" height="225"
                     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder: Thumbnail"
                     preserveAspectRatio="xMidYMid slice" focusable="false"><title>Placeholder</title>
                    <image height="100%" width="100%" xlink:href="{{ user.avatar|mymedia }}"/>
                </svg>
            </div>
        </form>
    </div>
</section>
{% endblock %}
